<!doctype html>
<html lang="ar" dir="rtl">

<title>بوسترات الصحيفة المصوّرة — العدد 35</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f4ec;color:#172b38;font:16px/1.8 Tahoma,Arial,sans-serif}
header{background:linear-gradient(130deg,#071a29,#174a68);color:#fff;padding:20px 4%;border-bottom:4px solid #d7b56d;text-align:center}
main{max-width:1050px;margin:24px auto;padding:0 4%}
h1{margin:0;font-size:clamp(22px,4vw,32px)}
p{text-align:center;color:#5e6d75}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
figure{margin:0;background:#fff;border:1px solid #ded7c7;border-radius:12px;padding:10px}
img{display:block;width:100%;height:auto;border-radius:7px}
.back{display:inline-block;margin:20px 0;background:#0b2639;color:#fff;padding:10px 16px;border-radius:7px;text-decoration:none}
@media(max-width:650px){.gallery{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>بوسترات الصحيفة المصوّرة — العدد 35</h1></header>

<section class="gallery">

<figure><img src="./issue35-poster-2.png" alt="بوستر الصحيفة المصوّرة — الصورة الثانية"></figure>
<figure><img src="./issue35-poster-3.png" alt="بوستر الصحيفة المصوّرة — الصورة الثالثة"></figure>
<figure><img src="./issue35-poster-4.png" alt="بوستر الصحيفة المصوّرة — الصورة الرابعة وما وراء الخبر"></figure>
</section>
<a class="back" href="./index.html">العودة إلى الصفحة الرئيسية</a>

</html>
