name: Telegram Auto Publish

on:
  workflow_dispatch:
  schedule:
    - cron: '25 * * * *'

permissions:
  contents: write

concurrency:
  group: telegram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Publish latest issue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@abwalapnwf"
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import subprocess
          import urllib.request
          import urllib.error
          from pathlib import Path

          base = "https://abwalanwf-wq.github.io/abu-al-anouf/"
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          channel = os.environ["TELEGRAM_CHANNEL"]
          state = Path(".github/telegram-last-issue.txt")

          if not token:
              raise SystemExit("Missing Telegram secret")

          def api(method, data):
              try:
                  req = urllib.request.Request(
                      "https://api.telegram.org/bot" + token + "/" + method,
                      data=json.dumps(data).encode(),
                      headers={"Content-Type": "application/json"}
                  )
                  with urllib.request.urlopen(req, timeout=30) as r:
                      result = json.load(r)
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"Telegram {method}: HTTP {e.code}")
              except Exception:
                  raise SystemExit(f"Telegram {method}: connection failed")

              if not result.get("ok"):
                  raise SystemExit(f"Telegram {method}: rejected")

              print(f"Telegram {method}: OK")
              return result["result"]

          bot = api("getMe", {})

          if bot.get("username", "").lower() != "abualanoufmediabot":
              raise SystemExit("Unexpected bot username")

          chat = api("getChat", {"chat_id": channel})

          member = api("getChatMember", {
              "chat_id": chat["id"],
              "user_id": bot["id"]
          })

          if chat.get("type") != "channel":
              raise SystemExit("Target is not a channel")

          if not member.get("can_post_messages"):
              raise SystemExit("Bot needs permission to post messages")

          print("Channel permissions: OK")

          def fetch(url):
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      return r.read()
              except Exception:
                  raise SystemExit("Website check failed: " + url)

          data = json.loads(fetch(base + "published.json"))
          numbers = []

          for item in data.get("items", []):
              url = item.get("url", "")
              if item.get("status") == "published" and url.startswith(base):
                  match = re.match(r"issue(\d+)-newsletter\.html", url[len(base):])
                  if match:
                      numbers.append(int(match.group(1)))

          if not numbers:
              raise SystemExit("No approved issue found")

          number = max(numbers)

          if number < 54:
              raise SystemExit("Old issue skipped")

          if state.exists():
              previous, status = state.read_text().split()
              if status == "pending":
                  raise SystemExit("Previous publication needs verification")
              if number <= int(previous):
                  print("Already published")
                  raise SystemExit(0)

          newsletter = base + f"issue{number}-newsletter.html"
          newspaper = base + f"issue{number}-newspaper.html"
          poster = base + f"poster-{number}.jpg"

          fetch(newsletter)
          fetch(newspaper)
          fetch(poster)

          def save_state(status):
              state.write_text(f"{number} {status}\n")
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", str(state)], check=True)
              subprocess.run(["git", "commit", "-m", f"Telegram issue {number} {status}"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)

          caption = (
              "شبكة أبو الأنوف الإعلامية\n"
              f"النشرة اليمنية اليومية — العدد {number}\n\n"
              "النشرة الإلكترونية:\n" + newsletter + "\n\n"
              "الصحيفة المصورة:\n" + newspaper + "\n\n"
              "صوت الوعي والمسؤولية | وعي يصنع الفرق"
          )

          save_state("pending")

          result = api("sendPhoto", {
              "chat_id": chat["id"],
              "photo": poster,
              "caption": caption
          })

          save_state("sent")
          print("Publication successful:", result["message_id"])
          PY
