name: تحديث المستجدات الإخبارية
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect source-attributed headlines
        run: python scripts/update_news.py
      - name: Commit updates when available
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news/published.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update sourced news headlines'
            git push
          fi
